name: Gua Godot Tests
description: Install Godot, download the released Gua GDScript addon, link it into a Godot project, and run .NET tests.

branding:
  icon: 'bell'
  color: 'green'

inputs:
  godot-version:
    description: Godot version without status suffix, for example 4.7 or 4.6.3.
    required: false
    default: "4.7"
  godot-status:
    description: Godot release status suffix, for example stable, rc1, or dev1.
    required: false
    default: stable
  godot-executable-suffix:
    description: Godot Windows executable archive suffix. Use win64.exe for GDScript builds.
    required: false
    default: win64.exe
  dotnet-version:
    description: .NET SDK version used by the external test runner.
    required: false
    default: 10.0.x
  gua-repository:
    description: Repository containing Gua Godot plugin releases.
    required: false
    default: link1345/gua
  gua-plugin-tag:
    description: Gua release tag. Leave empty to use the latest stable gua-v* release containing a matching addon asset.
    required: false
    default: ""
  gua-plugin-asset-pattern:
    description: Asset name wildcard used to select the addon zip from the release.
    required: false
    default: gua-godot-plugin-*.zip
  project-path:
    description: Path to the consumer Godot project directory.
    required: false
    default: game
  test-project:
    description: Path to the consumer .NET test project that uses Gua.Testing.Godot.
    required: true
  configuration:
    description: .NET test configuration.
    required: false
    default: Release
  test-logger:
    description: dotnet test logger argument.
    required: false
    default: trx;LogFileName=godot.trx

outputs:
  godot-executable:
    description: Absolute path to the downloaded Godot executable.
    value: ${{ steps.download-godot.outputs.godot-executable }}
  addon-path:
    description: Path where the Gua addon was linked inside the Godot project.
    value: ${{ inputs.project-path }}/addons/gua

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Download Godot
      id: download-godot
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $tag = "${{ inputs.godot-version }}-${{ inputs.godot-status }}"
        $archiveName = "Godot_v${tag}_${{ inputs.godot-executable-suffix }}.zip"
        $downloadUrl = "https://github.com/godotengine/godot-builds/releases/download/${tag}/${archiveName}"
        $installDir = Join-Path $env:RUNNER_TEMP "godot-${tag}"
        $archivePath = Join-Path $env:RUNNER_TEMP $archiveName

        Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
        Expand-Archive -Path $archivePath -DestinationPath $installDir -Force

        $executableName = "Godot_v${tag}_${{ inputs.godot-executable-suffix }}"
        $godot = Get-ChildItem -Path $installDir -Recurse -Filter $executableName | Select-Object -First 1
        if ($null -eq $godot) {
          throw "Could not find Godot executable '${executableName}' in ${archiveName}."
        }

        "GODOT_EXECUTABLE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        "godot-executable=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Print Godot version
      shell: pwsh
      run: '& "$env:GODOT_EXECUTABLE" --version'

    - name: Download and link Gua addon
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $repository = "${{ inputs.gua-repository }}"
        $tag = "${{ inputs.gua-plugin-tag }}"
        $assetPattern = "${{ inputs.gua-plugin-asset-pattern }}"
        $headers = @{ "User-Agent" = "gua-godot-actions" }

        if ([string]::IsNullOrWhiteSpace($tag)) {
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/releases" -Headers $headers
          $release = $releases |
            Where-Object {
              -not $_.draft -and
              -not $_.prerelease -and
              $_.tag_name -like "gua-v*" -and
              @($_.assets | Where-Object { $_.name -like $assetPattern }).Count -gt 0
            } |
            Select-Object -First 1

          if ($null -eq $release) {
            $release = $releases |
              Where-Object {
                -not $_.draft -and
                -not $_.prerelease -and
                $_.tag_name -like "godot-plugin-*" -and
                @($_.assets | Where-Object { $_.name -like $assetPattern }).Count -gt 0
              } |
              Select-Object -First 1
          }

          if ($null -eq $release) {
            throw "No stable gua-v* or legacy godot-plugin-* release containing an asset matching '${assetPattern}' was found in ${repository}."
          }
        } else {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/releases/tags/${tag}" -Headers $headers
        }

        $asset = $release.assets | Where-Object { $_.name -like $assetPattern } | Select-Object -First 1
        if ($null -eq $asset) {
          throw "No release asset matching '${assetPattern}' was found in release '$($release.tag_name)'."
        }

        $downloadDir = Join-Path $env:RUNNER_TEMP "gua-godot-plugin-$($release.tag_name)"
        $archivePath = Join-Path $downloadDir $asset.name
        $extractDir = Join-Path $downloadDir "extract"
        New-Item -ItemType Directory -Force $downloadDir | Out-Null
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath -Headers $headers
        Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

        $sourceAddon = Join-Path $extractDir "addons/gua"
        if (!(Test-Path -LiteralPath $sourceAddon)) {
          throw "The release asset '$($asset.name)' does not contain addons/gua."
        }
        $extensionDll = Join-Path $sourceAddon "bin/gua_godot.windows.debug.x86_64.dll"
        $runtimeDll = Join-Path $sourceAddon "bin/gua_runtime.dll"
        if (!(Test-Path -LiteralPath $extensionDll) -or !(Test-Path -LiteralPath $runtimeDll)) {
          throw "The release asset '$($asset.name)' is missing the built Gua DLLs."
        }

        $addonParent = Join-Path "${{ inputs.project-path }}" "addons"
        $targetAddon = Join-Path $addonParent "gua"
        New-Item -ItemType Directory -Force $addonParent | Out-Null
        if (Test-Path -LiteralPath $targetAddon) {
          Remove-Item -LiteralPath $targetAddon -Recurse -Force
        }
        Copy-Item -LiteralPath $sourceAddon -Destination $targetAddon -Recurse -Force

    - name: Prepare Godot project imports
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $projectPath = (Resolve-Path -LiteralPath "${{ inputs.project-path }}").Path
        $arguments = @(
          "--headless",
          "--editor",
          "--path",
          "`"$projectPath`"",
          "--quit-after",
          "300"
        )
        $godot = Start-Process `
          -FilePath $env:GODOT_EXECUTABLE `
          -ArgumentList $arguments `
          -WorkingDirectory $projectPath `
          -WindowStyle Hidden `
          -Wait `
          -PassThru
        if ($godot.ExitCode -ne 0) {
          throw "Godot project import failed with exit code $($godot.ExitCode)."
        }

        $classCache = Join-Path $projectPath ".godot/global_script_class_cache.cfg"
        if (!(Test-Path -LiteralPath $classCache) -or
            !(Select-String -LiteralPath $classCache -SimpleMatch '"class": &"GuaAutoAdapter"' -Quiet)) {
          throw "Godot import did not register GuaAutoAdapter in '$classCache'."
        }

    - name: Restore tests
      shell: pwsh
      run: dotnet restore "${{ inputs.test-project }}"

    - name: Run Godot tests
      shell: pwsh
      run: dotnet test "${{ inputs.test-project }}" --configuration "${{ inputs.configuration }}" --no-restore --logger "${{ inputs.test-logger }}"
